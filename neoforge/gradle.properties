# 机器相关项：本机 JAVA_HOME 未设置、PATH 上的 java 是 1.8，Gradle 9 的启动器会拒绝运行。
# 这里显式指向 JDK 25（= MC 26.1.2 / NeoForge 26.1.2.124 的 class 版本要求），让构建器与编译目标用同一个 JVM。
# 换机器若没有这个 JDK，请改成本机路径，或删掉本行并在系统里设 JAVA_HOME。
org.gradle.java.home=C:/Users/Lenovo/.gradle/jdks/eclipse_adoptium-25-amd64-windows.2
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# moddev 与配置缓存有已知冲突，关掉。
org.gradle.configuration-cache=false

minecraft_version=26.1.2
neo_version=26.1.2.124
minecraft_version_range=[26.1.2]
neo_version_range=[26.1.2.124,)

mod_id=getitup
mod_name=TOMC-Get It up
# 主.次.修 之后由 build-count.txt 自动补第 4 段（构建次数）。
mod_version=0.1.0
mod_group_id=io.github.thatone0502.getitup
mod_authors=ThatOne
mod_license=GPL-3.0-or-later
# mod_description 不放在这里：它要带换行。properties 里的 \n 会被 java.util.Properties 解成真换行，
# 进了 TOML 就是非法的多行基本字符串。所以描述直接写在 neoforge.mods.toml 里（转义写法 \n\n）。

# 可选前置：装了 Cloth Config 才提供配置界面，没装就退回手写 config/getitup.json。
cloth_config_version=26.1.154
